  const main = document.getElementById("cut"); main.replaceChildren();
  const top = el("section",{class:"card"});
  top.append(el("h2",{text:c.title}));
  if (c.intro) top.append(el("p",{class:"why",text:c.intro}));
  if (c.video){ if (c.videoLabel) top.append(el("div",{class:"kicker",text:c.videoLabel})); const v=el("video",{controls:"",preload:"metadata",playsinline:""}); v.src=c.video; if (c.poster) v.poster=c.poster; top.append(v); }
  else if (!c.noVideo) top.append(el("div",{class:"empty",text:"Render in progress: the video appears here when it is ready."}));
  if (c.video2){ top.append(el("div",{class:"kicker",text:c.video2Label||"Alternative"})); const v2=el("video",{controls:"",preload:"metadata",playsinline:""}); v2.src=c.video2; top.append(v2); }
  if (c.stats && c.stats.length){ const s=el("div",{class:"stats"}); c.stats.forEach(x=>s.append(el("span",{class:"chip",text:x}))); top.append(s); }
  if (c.changed){ const ch=el("div",{}, el("div",{class:"kicker",text:c.changedLabel||"What changed"})); const ul=el("ul"); c.changed.forEach(x=>ul.append(el("li",{text:x}))); ch.append(ul); top.append(ch); }
  if (c.standin){ const sd=el("div",{}, el("div",{class:"kicker",text:"Stand-in or missing"})); const ul2=el("ul"); c.standin.forEach(x=>ul2.append(el("li",{text:x}))); sd.append(ul2); top.append(sd); }
  if (c.srt){ const d=el("details"); d.append(el("summary",{text:"Captions (.srt)"}), el("pre",{text:c.srt})); top.append(d); }
  main.append(top);

  const form=el("section",{class:"card"}); form.append(el("h2",{text:"Questions"}));
  const qs=(c.noVerdict?[]:[{k:"verdict",t:"Verdict",o:VERDICT.map(([v,l,d])=>[v,l,d])}]).concat(c.questions);
  qs.forEach((q,i)=>{
    const box=el("div",{class:"q"}); box.append(el("h3",{text:(i+1)+". "+q.t}));
    if (q.o){ const opts=el("div",{class:"opts",role:"radiogroup","aria-label":q.t});
      q.o.forEach(([v,l,d,sug])=>{ const id=current+"_"+q.k+"_"+v; const inp=el("input",{type:"radio",name:current+"_"+q.k,id,value:v}); if (a[q.k]===v) inp.checked=true;
        inp.addEventListener("change",()=>{a[q.k]=v; changed();});
        const lab=el("label",{class:"opt",for:id}); const txt=el("span"); txt.append(el("b",{text:l})); if (d) txt.append(el("small",{text:d})); if (sug) txt.append(el("span",{class:"sug",text:"suggested"})); lab.append(inp,txt); opts.append(lab); });
      box.append(opts); }
    const ta=el("textarea",{id:current+"_"+q.k+"_note",placeholder:q.o?"Note (optional)":"Your answer","aria-label":q.t+" note"}); ta.value=a[q.k+"_note"]||"";
    ta.addEventListener("input",()=>{a[q.k+"_note"]=ta.value; changed();}); box.append(ta); form.append(box);
  });
  const bar=el("div",{class:"bar"}); const save=el("button",{class:"primary",type:"button",id:"savebtn",text:"Save answers"}); const st=el("span",{class:"status",id:"savestatus"});
  save.addEventListener("click",()=>persist(true)); bar.append(save,st); form.append(bar);
  main.append(form);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.cut===current)));
  fillCopy(); showSaved();
}

function fillCopy(){
  const lines=[];
  for (const key of Object.keys(CUTS)){ const c=CUTS[key], a=answers[key]||{}; const qs=(c.noVerdict?[]:[{k:"verdict",t:"Verdict",o:VERDICT}]).concat(c.questions);
    const got=qs.filter(q=>a[q.k]||a[q.k+"_note"]); if (!got.length) continue; lines.push("["+c.title+"]");
    got.forEach(q=>{ const opt=q.o&&q.o.find(o=>o[0]===a[q.k]); lines.push(q.k+" ("+q.t+"): "+(opt?opt[1]:"-")+(a[q.k+"_note"]?" - "+a[q.k+"_note"]:"")); }); }
  document.getElementById("copybox").value=lines.join("\n");
}
let timer=null;
function changed(){ try{localStorage.setItem(LS,JSON.stringify(answers));}catch(_){} fillCopy(); clearTimeout(timer); timer=setTimeout(()=>persist(false),1200); }
async function persist(manual){
  const st=document.getElementById("savestatus");
  if (!db){ if (st) st.textContent = manual ? "Saved in this browser only (sign in to save to the page)." : "Saved in this browser."; return; }
  try { await db.doc(CUTS[current].doc).set(Object.assign({}, answers[current], {updated: new Date().toISOString()})); if (st) st.textContent="Saved to the page."; }
  catch(e){ if (st) st.textContent="Could not save to the page ("+(e&&e.code||"error")+"); kept in this browser."; }
}
function showSaved(){ const st=document.getElementById("savestatus"); if (st && !st.textContent) st.textContent = db ? "" : "Answers keep in this browser until the page connects."; }

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{current=t.dataset.cut; render(); try{localStorage.setItem(LS+"_tab",current);}catch(_){} }));
try { const t=localStorage.getItem(LS+"_tab"); if (t && CUTS[t]) current=t; } catch(_){}
document.getElementById("copybtn").addEventListener("click",async()=>{ const box=document.getElementById("copybox"), s=document.getElementById("copystatus");
  try{ await navigator.clipboard.writeText(box.value); s.textContent="Copied."; } catch(_){ box.select(); s.textContent="Selected: press Ctrl+C."; } });
render();

(async()=>{ try{ if (!window.claude || !window.claude.use) return; db = await window.claude.use("db"); if (!db) return;
  for (const key of Object.keys(CUTS)){ try{ const snap=await db.doc(CUTS[key].doc).get(); const d=snap&&snap.data&&snap.data(); if (d){ const local=answers[key]||{}; answers[key]=Object.assign({}, d, local); } }catch(_){} }
  render(); } catch(_){} })();
</script>
