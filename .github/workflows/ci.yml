name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqlite3 libsqlite3-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_BUILD__SQLITE3: "--enable-system-libraries"
        with:
          ruby-version: 2.7.8
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqlite3 libsqlite3-dev libpq-dev ffmpeg

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_BUILD__SQLITE3: "--enable-system-libraries"
        with:
          ruby-version: 2.7.8
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          BE_DB_USER: postgres
          BE_DB_PASSWORD: postgres
          BE_DB_HOST: localhost
        run: |
          bin/rails app:db:prepare
          bin/rails test

  node-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqlite3 libsqlite3-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_BUILD__SQLITE3: "--enable-system-libraries"
        with:
          ruby-version: 2.7.8
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node packages
        run: npm ci

      # validator-portrait-variants.test.mjs writes ink under <repo>/tmp, which is
      # git-ignored and so absent from a fresh checkout.
      - name: Create tmp/
        run: mkdir -p tmp

      # The validator tests spawn plain `ruby`; bundle exec puts Bundler's
      # RUBYOPT in the environment so the child can load the json-schema gem.
      - name: Social and validator tests
        run: bundle exec bin/test-js -j 4 test/js/validator-*.test.mjs test/js/social-*.test.mjs

      # bin/test-js runs each file in its own `node --test` process (one
      # `node --test test/js/*.test.mjs` hits a Node 18 runner IPC error, "Unable to
      # deserialize cloned data", from test children that log heavily to stdout).
      # It re-runs a file only on that exact error and prints the retry. No
      # quarantine list: every file is a real gate.
      - name: Whole test/js suite (regression cover for m01-m08)
        run: bundle exec bin/test-js -j 4

      # Social scenarios are found by rendering each scenario.json.erb with the
      # validator's own render_erb_to_json and checking the top-level `social` key,
      # so indentation, layout or a key emitted from ERB cannot hide one (P0-R R-06).
      # EXPECTED_SOCIAL lists scenarios that must be found; add each social
      # scenario here when it lands (none ship yet).
      - name: Validator over scenarios with a social key
        env:
          LIST_SOCIAL: >-
            require "./scripts/validate_scenario.rb";
            ARGV.each { |f| j = render_erb_to_json(f); puts f if j.is_a?(Hash) && j.key?("social") }
          EXPECTED_SOCIAL: ""
        run: |
          set -euo pipefail
          # The lister must see the fixtures' social key (sf_clean, sf_broken) and not sf_nosocial
          fixtures=$(bundle exec ruby -e "$LIST_SOCIAL" test/js/fixtures/social_framework/scenarios/*/scenario.json.erb)
          echo "$fixtures"
          for want in sf_clean sf_broken; do
            grep -q "/$want/scenario.json.erb" <<<"$fixtures" || { echo "lister missed fixture $want"; exit 1; }
          done
          if grep -q "/sf_nosocial/" <<<"$fixtures"; then echo "lister matched sf_nosocial"; exit 1; fi

          found=$(bundle exec ruby -e "$LIST_SOCIAL" scenarios/*/scenario.json.erb)
          for want in $EXPECTED_SOCIAL; do
            grep -q "^scenarios/$want/scenario.json.erb$" <<<"$found" || { echo "expected social scenario not found: $want"; exit 1; }
          done
          count=0
          while IFS= read -r scenario; do
            [ -n "$scenario" ] || continue
            echo "== $scenario"
            bundle exec ruby scripts/validate_scenario.rb "$scenario" --strict-social --no-graph --skip-ink
            count=$((count + 1))
          done <<<"$found"
          echo "Validated $count scenario(s) with a social key"

      # Tracked files unchanged, and nothing new written beside them (a dungeon
      # graph or compiled ink next to an untracked source) (P0-R R-07)
      - name: No tracked file was rewritten, no file was added
        run: |
          git diff --exit-code
          status=$(git status --porcelain)
          if [ -n "$status" ]; then echo "$status"; echo "files were added or changed by the run"; exit 1; fi
