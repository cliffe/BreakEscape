  why: reads the authored scenario for tooling, models or the server's own checks,
    never an answer; an account keeps its place
lib/break_escape/ops_log_events.rb#npc_named:
  action: keep
  why: names the holder of a card the log row carries; an account-only account has
    no creds.card (the validator rule privilege_account_only forbids one)
lib/break_escape/ops_log_events.rb#profile_owner:
  action: keep
  why: returns the owner whose existence check needs it; the shown name goes through
    profile_shown_name, which gives the profile id for an account-only owner (R1-SERVER6)
